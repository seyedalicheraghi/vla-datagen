<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" width="680" height="296" role="img"><title>Closed loop: the policy acts on what it sees, the simulator keeps score</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.t { font-size: 14px; fill: #1f2328; }
.ts { font-size: 12px; fill: #59636e; }
.th { font-size: 14px; font-weight: 700; fill: #1f2328; }
.arr { stroke: #6b7480; stroke-width: 1.5; fill: none; }
.c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray > .th { fill: #444441; }
.c-gray > .ts, .c-gray > .t { fill: #5F5E5A; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; }
.c-purple > .ts, .c-purple > .t { fill: #534AB7; }
.c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th, .c-teal > .ts, .c-teal > .t { fill: #085041; }
.c-coral > rect { fill: #FAECE7; stroke: #993C1D; }
.c-coral > .th, .c-coral > .ts, .c-coral > .t { fill: #712B13; }
.c-green > rect { fill: #EAF3DE; stroke: #3B6D11; }
.c-green > .th, .c-green > .t { fill: #27500A; }
.c-green > .ts { fill: #3B6D11; }
@media (prefers-color-scheme: dark) {
  .t, .th { fill: #e6edf3; }
  .ts { fill: #9198a1; }
  .arr { stroke: #8f98a3; }
  .c-gray > rect { fill: #444441; stroke: #B4B2A9; }
  .c-gray > .th { fill: #F1EFE8; }
  .c-gray > .ts, .c-gray > .t { fill: #D3D1C7; }
  .c-purple > rect { fill: #3C3489; stroke: #AFA9EC; }
  .c-purple > .th { fill: #EEEDFE; }
  .c-purple > .ts, .c-purple > .t { fill: #CECBF6; }
  .c-teal > rect { fill: #085041; stroke: #5DCAA5; }
  .c-teal > .th, .c-teal > .t { fill: #E1F5EE; }
  .c-teal > .ts { fill: #9FE1CB; }
  .c-coral > rect { fill: #712B13; stroke: #F0997B; }
  .c-coral > .th, .c-coral > .t { fill: #FAECE7; }
  .c-coral > .ts { fill: #F5C4B3; }
  .c-green > rect { fill: #27500A; stroke: #97C459; }
  .c-green > .th, .c-green > .t { fill: #EAF3DE; }
  .c-green > .ts { fill: #C0DD97; }
}
</style>
<defs><marker id="cl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="16" y="20" width="180" height="80" rx="8" stroke-width="0.5"/><text class="th" x="106" y="44" text-anchor="middle" dominant-baseline="central">Unseen scene</text><text class="ts" x="106" y="66" text-anchor="middle" dominant-baseline="central">seeds never used</text><text class="ts" x="106" y="82" text-anchor="middle" dominant-baseline="central">for training</text></g>
<g class="c-purple"><rect x="250" y="20" width="180" height="80" rx="8" stroke-width="0.5"/><text class="th" x="340" y="44" text-anchor="middle" dominant-baseline="central">Simulator</text><text class="ts" x="340" y="66" text-anchor="middle" dominant-baseline="central">moves the warehouse</text><text class="ts" x="340" y="82" text-anchor="middle" dominant-baseline="central">forward 1/30 s</text></g>
<g class="c-teal"><rect x="484" y="20" width="180" height="80" rx="8" stroke-width="0.5"/><text class="th" x="574" y="44" text-anchor="middle" dominant-baseline="central">Observation</text><text class="ts" x="574" y="66" text-anchor="middle" dominant-baseline="central">3 camera images, 224 px</text><text class="ts" x="574" y="82" text-anchor="middle" dominant-baseline="central">+ state + instruction</text></g>
<g class="c-coral"><rect x="484" y="196" width="180" height="80" rx="8" stroke-width="0.5"/><text class="th" x="574" y="220" text-anchor="middle" dominant-baseline="central">Policy</text><text class="ts" x="574" y="242" text-anchor="middle" dominant-baseline="central">a trained model, or</text><text class="ts" x="574" y="258" text-anchor="middle" dominant-baseline="central">the scripted driver</text></g>
<g class="c-teal"><rect x="250" y="196" width="180" height="80" rx="8" stroke-width="0.5"/><text class="th" x="340" y="220" text-anchor="middle" dominant-baseline="central">Action</text><text class="ts" x="340" y="242" text-anchor="middle" dominant-baseline="central">speed, turn rate,</text><text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">fork command</text></g>
<g class="c-green"><rect x="16" y="196" width="180" height="80" rx="8" stroke-width="0.5"/><text class="th" x="106" y="220" text-anchor="middle" dominant-baseline="central">Judge</text><text class="ts" x="106" y="242" text-anchor="middle" dominant-baseline="central">lifted 1 m or more,</text><text class="ts" x="106" y="258" text-anchor="middle" dominant-baseline="central">then set down</text></g>
<line x1="198" y1="60" x2="246" y2="60" class="arr" marker-end="url(#cl-arrow)"/>
<line x1="432" y1="60" x2="480" y2="60" class="arr" marker-end="url(#cl-arrow)"/>
<line x1="574" y1="102" x2="574" y2="192" class="arr" marker-end="url(#cl-arrow)"/>
<line x1="482" y1="236" x2="434" y2="236" class="arr" marker-end="url(#cl-arrow)"/>
<line x1="340" y1="194" x2="340" y2="104" class="arr" marker-end="url(#cl-arrow)"/>
<path d="M250 86H223V236H200" class="arr" stroke-dasharray="4 3" marker-end="url(#cl-arrow)"/>
<text class="ts" x="457" y="142" text-anchor="middle" dominant-baseline="central">one turn</text>
<text class="ts" x="457" y="158" text-anchor="middle" dominant-baseline="central">every 1/30 s</text>
</svg>
