<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img"><title>Five stages from simulation to real use, with a gate between each pair</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.t { font-size: 14px; fill: #1f2328; }
.ts { font-size: 12px; fill: #59636e; }
.th { font-size: 14px; font-weight: 700; fill: #1f2328; }
.arr { stroke: #6b7480; stroke-width: 1.5; fill: none; }
.c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray > .th { fill: #444441; }
.c-gray > .ts, .c-gray > .t { fill: #5F5E5A; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; }
.c-purple > .ts, .c-purple > .t { fill: #534AB7; }
.c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th, .c-teal > .ts, .c-teal > .t { fill: #085041; }
.c-coral > rect { fill: #FAECE7; stroke: #993C1D; }
.c-coral > .th, .c-coral > .ts, .c-coral > .t { fill: #712B13; }
.c-green > rect { fill: #EAF3DE; stroke: #3B6D11; }
.c-green > .th, .c-green > .t { fill: #27500A; }
.c-green > .ts { fill: #3B6D11; }
@media (prefers-color-scheme: dark) {
  .t, .th { fill: #e6edf3; }
  .ts { fill: #9198a1; }
  .arr { stroke: #8f98a3; }
  .c-gray > rect { fill: #444441; stroke: #B4B2A9; }
  .c-gray > .th { fill: #F1EFE8; }
  .c-gray > .ts, .c-gray > .t { fill: #D3D1C7; }
  .c-purple > rect { fill: #3C3489; stroke: #AFA9EC; }
  .c-purple > .th { fill: #EEEDFE; }
  .c-purple > .ts, .c-purple > .t { fill: #CECBF6; }
  .c-teal > rect { fill: #085041; stroke: #5DCAA5; }
  .c-teal > .th, .c-teal > .t { fill: #E1F5EE; }
  .c-teal > .ts { fill: #9FE1CB; }
  .c-coral > rect { fill: #712B13; stroke: #F0997B; }
  .c-coral > .th, .c-coral > .t { fill: #FAECE7; }
  .c-coral > .ts { fill: #F5C4B3; }
  .c-green > rect { fill: #27500A; stroke: #97C459; }
  .c-green > .th, .c-green > .t { fill: #EAF3DE; }
  .c-green > .ts { fill: #C0DD97; }
}
</style>
<defs><marker id="stage-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-green"><rect x="110" y="20" width="460" height="60" rx="8" stroke-width="0.5"/><text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">Simulation, clean</text><text class="ts" x="340" y="61" text-anchor="middle" dominant-baseline="central">unseen scenes, outside judge (done for the scripted driver)</text></g>
<text class="ts" x="100" y="50" text-anchor="end" dominant-baseline="central">this post</text>
<g class="c-gray"><rect x="110" y="120" width="460" height="60" rx="8" stroke-width="0.5"/><text class="th" x="340" y="140" text-anchor="middle" dominant-baseline="central">Simulation, stressed</text><text class="ts" x="340" y="161" text-anchor="middle" dominant-baseline="central">noisy pose, camera delay, new lighting and truck response</text></g>
<g class="c-gray"><rect x="110" y="220" width="460" height="60" rx="8" stroke-width="0.5"/><text class="th" x="340" y="240" text-anchor="middle" dominant-baseline="central">Real truck, shadow mode</text><text class="ts" x="340" y="261" text-anchor="middle" dominant-baseline="central">a person drives; the policy only predicts, and we compare</text></g>
<g class="c-gray"><rect x="110" y="320" width="460" height="60" rx="8" stroke-width="0.5"/><text class="th" x="340" y="340" text-anchor="middle" dominant-baseline="central">Real truck, supervised</text><text class="ts" x="340" y="361" text-anchor="middle" dominant-baseline="central">the 20 test layouts on a marked floor, slow, with an emergency stop</text></g>
<g class="c-gray"><rect x="110" y="420" width="460" height="60" rx="8" stroke-width="0.5"/><text class="th" x="340" y="440" text-anchor="middle" dominant-baseline="central">Real use, limited</text><text class="ts" x="340" y="461" text-anchor="middle" dominant-baseline="central">a fenced area, with a safety system that does not trust the policy</text></g>
<line x1="340" y1="82" x2="340" y2="116" class="arr" marker-end="url(#stage-arrow)"/>
<line x1="340" y1="182" x2="340" y2="216" class="arr" marker-end="url(#stage-arrow)"/>
<line x1="340" y1="282" x2="340" y2="316" class="arr" marker-end="url(#stage-arrow)"/>
<line x1="340" y1="382" x2="340" y2="416" class="arr" marker-end="url(#stage-arrow)"/>
<text class="ts" x="352" y="100" dominant-baseline="central">passes on unseen scenes</text>
<text class="ts" x="352" y="200" dominant-baseline="central">score holds under stress</text>
<text class="ts" x="352" y="300" dominant-baseline="central">predictions match the driver</text>
<text class="ts" x="352" y="400" dominant-baseline="central">real score close to simulated score</text>
</svg>
